<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>

    rel="stylesheet">

  <style>
    :root {

      --accent: #EA580C;
      --accent-rgb: 234, 88, 12;
      --accent-2: #EA580C;

      --bg: #140A05;
      --bg-rgb: 20, 10, 5;
      --bg-deep: #080402;
      --bg-end: #050505;
      --surface: #1E0F07;

      --text: #FFFFFF;
      --muted: rgba(255, 255, 255, .62);
      --faint: rgba(255, 255, 255, .35);
      --grid: rgba(255, 255, 255, .035);
      --name-shadow: 0 4px 18px rgba(0, 0, 0, .6);

      --btn-bg: #161112;
      --btn-border: rgba(255, 255, 255, .10);
      --btn-text: #FFFFFF;
      --btn-primary-text: #FFFFFF;
      --display: 'Anton', sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    html[data-theme="light"] {
      --bg: #FBF8F7;
      --bg-rgb: 251, 248, 247;
      --bg-deep: #EFEAE8;
      --bg-end: #F7F3F2;
      --surface: #FFFFFF;
      --text: #161112;
      --muted: rgba(22, 17, 18, .62);
      --faint: rgba(22, 17, 18, .40);
      --grid: rgba(0, 0, 0, .04);
      --name-shadow: none;
      --btn-bg: #F5F1F0;
      --btn-border: rgba(0, 0, 0, .10);
      --btn-text: #161112;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      font-family: var(--body);
      color: var(--text);
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      background: var(--surface);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }

    .hero {
      position: relative;
      height: 62vh;
      min-height: 420px;
      background: center top/cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(var(--bg-rgb), 0) 0%,
          rgba(var(--bg-rgb), 0) 35%,
          rgba(var(--bg-rgb), .35) 55%,
          rgba(var(--bg-rgb), .75) 78%,
          rgba(var(--bg-rgb), 1) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      margin-top: -90px;
      padding: 0 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .handle {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }

    .name {
      position: relative;
      z-index: 2;
      font-family: var(--display);
      font-size: clamp(38px, 10vw, 52px);
      line-height: .95;
      letter-spacing: .01em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: var(--name-shadow);
    }

    .bio {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .links {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--btn-text);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
    }

    .btn .btn-ico {
      flex: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-2)
    }

    .btn .btn-ico svg {
      width: 20px;
      height: 20px
    }

    .btn .labels {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .btn .title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .btn .subtitle {
      font-size: 11.5px;
      font-weight: 500;
      opacity: .85;
      margin-top: 2px
    }

    .btn .arrow {
      flex: 0 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted)
    }

    .btn .arrow svg {
      width: 18px;
      height: 18px
    }

    .btn.primary {
      color: var(--btn-primary-text);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(var(--accent-rgb), .28);
    }

    .btn.primary .btn-ico,
    .btn.primary .arrow {
      color: var(--btn-primary-text)
    }

    .video-card {
      margin-top: 14px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #000;
      cursor: pointer;
      aspect-ratio: 16/9;
    }

    .video-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .video-card .play {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(var(--accent-rgb), .92);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .5);
    }

    .video-card .play svg {
      width: 22px;
      height: 22px;
      margin-left: 3px
    }

    .video-card .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 26px 14px 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(to top, rgba(0, 0, 0, .8), transparent);
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block
    }

    .social {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--btn-border);
      background: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-2);
      text-decoration: none;
    }

    .social a svg {
      width: 22px;
      height: 22px
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--faint);
      text-decoration: none;
    }

    @media (max-width:480px) {
      body {
        padding: 0
      }

      .wrap {
        max-width: 100%;
        border-radius: 0;
        box-shadow: none;
        min-height: 100vh
      }

      .content {
        padding: 0 18px 28px
      }
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(60% 55% at 100% 0%, rgba(var(--accent-rgb), .22) 0%, rgba(var(--accent-rgb), 0) 70%), radial-gradient(45% 45% at 0% 100%, rgba(var(--accent-rgb), .08) 0%, rgba(var(--accent-rgb), 0) 70%), linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-end) 100%)
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 96px 96px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 85%);
      mask-image: radial-gradient(ellipse at center, #000 25%, transparent 85%)
    }

    @keyframes pageIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: scale(1.05)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.05)
      }
    }

    body {
      animation: pageIn 1.4s ease both
    }

    .hero {
      animation: heroIn 2.4s var(--ease) both
    }

    .reveal {
      animation: fadeUp 1.3s var(--ease) backwards;
      animation-delay: calc(var(--i)*150ms + 700ms)
    }

    .btn {
      transition: transform .5s var(--ease), border-color .45s var(--ease), box-shadow .55s var(--ease)
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent)
    }

    .btn:active {
      transform: translateY(0) scale(.985)
    }

    .btn.primary:hover {
      box-shadow: 0 10px 26px rgba(var(--accent-rgb), .42)
    }

    .btn .arrow {
      transition: transform .55s var(--ease)
    }

    .btn:hover .arrow {
      transform: translateX(4px)
    }

    .social a {
      transition: transform .5s var(--ease), border-color .4s var(--ease)
    }

    .social a:hover {
      transform: translateY(-2px) scale(1.08);
      border-color: var(--accent)
    }

    .video-card img {
      transition: transform .9s var(--ease)
    }

    .video-card:hover img {
      transform: scale(1.03)
    }

    .play {
      animation: pulse 3.6s ease-in-out infinite
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      .reveal {
        opacity: 1
      }
    }
  </style>
</head>

        { title: "Como chegar ELO NAILS ART", subtitle: "Av. Moaci, 313 - Planalto Paulista, São Paulo - SP", icon: "pin", url: "https://www.google.com/maps/search/?api=1&query=Av.%20Moaci%2C%20313%20-%20Planalto%20Paulista%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2004083-000" }

    };

    const ICONS = {
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 3l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21l1.5-1.5"/></svg>',
      cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h10L20 7H6"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
      tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-8-8 8-8h8v8z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>',
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-10a6 6 0 0 1 12 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',
      cap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.2 2.7 2.5 6 2.5s6-1.3 6-2.5v-4.5"/><path d="M22 9v5"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M12 9v11M3.5 13h17"/><path d="M12 9c-2.5 0-4-1-4-2.5S9.5 4 12 9c2.5-5 4-3.5 4-2.5S14.5 9 12 9z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="16.9" cy="7.1" r="1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3v11.6a3.6 3.6 0 1 1-3.1-3.57"/><path d="M13.5 3c.4 2.6 2.2 4.2 4.8 4.4"/></svg>',

      x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2h-3a5 5 0 0 0-5 5v3H6v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>'
    };

    const SOCIAIS = ["instagram", "tiktok", "facebook", "youtube", "spotify", "whatsapp", "x"];

    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, "").toLowerCase(); }
      catch (e) { return ""; }
    }

    function normalizeLink(item) {
      if (typeof item === "string") {
        const md = item.match(/^\[(.+?)\]\((https?:\/\/\S+)\)$/);
        if (md) return { title: md[1], subtitle: "", url: md[2] };
        const parts = item.split("|").map(function (p) { return p.trim() });
        if (parts.length >= 3) return { title: parts[0], subtitle: parts[1], url: parts[2] };
        if (parts.length === 2 && parts[1].startsWith("http")) return { title: parts[0], subtitle: "", url: parts[1] };
        return { title: item, subtitle: "", url: "" };
      }
      return { title: item.title || "", subtitle: item.subtitle || "", url: item.url || "", icon: item.icon || "" };
    }

    function linkIconFor(url) {
      const h = hostOf(url);
      if (h.includes("kiwify") || h.includes("hotmart") || h.includes("pay")) return ICONS.tag;
      if (h.includes("loja") || h.includes("shop") || h.includes("suplement") ||
        h.includes("goodliftpower") || h.includes("4climb") || h.includes("darklab")) return ICONS.cart;
      if (h.includes("netlify") || h.includes("linktr")) return ICONS.clock;
      return ICONS.link;
    }

    function moveSocialsToIcons() {
      PROFILE.links = PROFILE.links.filter(function (l) {
        const h = hostOf(normalizeLink(l).url);
        return !h.includes("instagram.com") && !h.includes("tiktok.com");
      });
    }

    function getVideoEmbed(url) {
      if (!url) return null;
      let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i);
      if (m) return "https://www.youtube.com/embed/" + m[1];
      m = url.match(/vimeo\.com\/(\d+)/i);
      if (m) return "https://player.vimeo.com/video/" + m[1];
      return null;
    }

    function buildPage() {
      document.title = PROFILE.nome;
      moveSocialsToIcons();
      let i = 0;
      let n = 0;

      const hero = document.getElementById("hero");
      if (PROFILE.foto) {
        const probe = new Image();
        probe.onload = function () { hero.style.backgroundImage = "url('" + PROFILE.foto + "')"; };
        probe.onerror = function () {
          hero.style.backgroundImage =
            "linear-gradient(to bottom, var(--accent) 0%, var(--bg) 100%)";
        };
        probe.src = PROFILE.foto;
      } else {
        hero.style.backgroundImage = "linear-gradient(to bottom, var(--accent) 0%, var(--bg) 100%)";
      }

      const content = document.getElementById("content");
      let html = "";

      html += '<div class="handle reveal" style="--i:' + (i++) + '">' + PROFILE.handle + '</div>';

      html += '<h1 class="name reveal" style="--i:' + (i++) + '">' + PROFILE.nome + '</h1>';

      if (PROFILE.bio) html += '<p class="bio reveal" style="--i:' + (i++) + '">' + PROFILE.bio + '</p>';

      html += '<div class="links">';
      PROFILE.links.forEach(function (item) {
        const l = normalizeLink(item);
        if (!l.url) return;
        html += '<a class="btn' + (n++ === 0 ? ' primary' : '') + ' reveal" style="--i:' + (i++) + '" href="' + l.url + '" target="_blank" rel="noopener noreferrer">'
          + '<span class="btn-ico">' + (l.icon && ICONS[l.icon] ? ICONS[l.icon] : linkIconFor(l.url)) + '</span>'
          + '<span class="labels"><span class="title">' + l.title + '</span>'
          + (l.subtitle ? '<span class="subtitle">' + l.subtitle + '</span>' : '')
          + '</span>'
          + '<span class="arrow">' + ICONS.arrow + '</span>'
          + '</a>';
      });
      html += '</div>';

      if (PROFILE.video) {
        const embed = getVideoEmbed(PROFILE.video);
        const thumb = embed && embed.indexOf("youtube.com/embed/") === 0
          ? "https://img.youtube.com/vi/" + embed.split("/embed/")[1] + "/hqdefault.jpg"
          : "";
        html += '<div class="video-card reveal" style="--i:' + (i++) + '" '
          + (embed
            ? 'data-embed="' + embed + '">'
            + (thumb ? '<img src="' + thumb + '" alt="Vídeo" loading="lazy">' : '')
            : 'onclick="window.open(\'' + PROFILE.video + '\',\'_blank\')">'
            + '<img src="' + (thumb || "") + '" alt="Vídeo" loading="lazy" style="background:#000">')
          + '<span class="play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg></span>'
          + '<span class="caption">Assistir ao vídeo</span>'
          + '</div>';
      }

      let socialHtml = "";
      const extras = (PROFILE.outros || []).filter(Boolean);
      const fila = [];
      if (PROFILE.instagram) fila.push({ url: PROFILE.instagram, key: "instagram" });
      if (PROFILE.tiktok) fila.push({ url: PROFILE.tiktok, key: "tiktok" });
      if (PROFILE.facebook) fila.push({ url: PROFILE.facebook, key: "facebook" });
      extras.forEach(function (u) {
        const h = hostOf(u);
        const key = SOCIAIS.find(function (s) { return h.includes(s) || (s === "x" && (h.includes("twitter.com") || h === "x.com")); });
        if (key && !fila.some(function (f) { return f.key === key; })) fila.push({ url: u, key: key });
      });
      fila.forEach(function (f) {
        socialHtml += '<a href="' + f.url + '" target="_blank" rel="noopener noreferrer" aria-label="' + f.key + '">' + ICONS[f.key] + '</a>';
      });
      if (socialHtml) html += '<div class="social reveal" style="--i:' + (i++) + '">' + socialHtml + '</div>';

      html += '<div class="footer reveal" style="--i:' + (i++) + '">© ' + new Date().getFullYear() + ' ' + PROFILE.handle + '</div>';

      content.innerHTML = html;

      const card = content.querySelector(".video-card[data-embed]");
      if (card) {
        card.addEventListener("click", function () {
          card.innerHTML = '<iframe src="' + card.dataset.embed + '?autoplay=1" title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
          card.style.cursor = "default";
        });
      }
    }

    buildPage();
  </script>
</body>

</html>
